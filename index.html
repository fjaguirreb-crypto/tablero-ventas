:root{
  --bg:#FFF8F6; --surface:#FFFFFF; --surface-2:#F7EFEC;
  --line:#ECE1DD; --line-strong:rgba(115,111,110,.28);
  --ink:#1D1B1A; --ink-2:#444748; --ink-3:#736F6E;
  --bronze:#775A19; --bronze-soft:#A98A3E; --bronze-tint:rgba(119,90,25,.10);
  --serif:'Bodoni Moda','Didot','Bodoni MT',Georgia,'Times New Roman',serif;
  --sans:'Hanken Grotesk',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans); overflow:hidden;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
.wrap{height:100vh; display:flex; flex-direction:column; padding:3vh 3vw; gap:2.4vh}

/* ---------- cabecera ---------- */
header{display:flex; justify-content:space-between; align-items:flex-end; flex:none;
       padding-bottom:1.6vh; border-bottom:1px solid var(--line-strong)}
.brand{display:flex; align-items:baseline; gap:1vw}
.brand .mark{font-family:var(--serif); font-size:3vh; font-weight:500; letter-spacing:.01em; color:var(--ink)}
.brand .bar{width:1px; height:2.4vh; background:var(--line-strong)}
.brand .sub{font-size:1.25vh; letter-spacing:.18em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
.status{display:flex; align-items:center; gap:.8vw; font-size:1.25vh; letter-spacing:.16em;
        text-transform:uppercase; color:var(--ink-3); font-weight:600;
        min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis}
.status #stxt{overflow:hidden; text-overflow:ellipsis}
.brand{min-width:0}
.brand .sub{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.status .clock{font-variant-numeric:tabular-nums}
.dot{width:.95vh; height:.95vh; border-radius:50%; background:var(--ink-3); flex:none}
.dot.live{background:var(--bronze); animation:breathe 2.6s ease-in-out infinite}
.dot.warn{background:transparent; box-shadow:inset 0 0 0 1.5px var(--ink-3)}
@keyframes breathe{0%,100%{opacity:.28} 50%{opacity:1}}

/* ---------- cuatro cifras ---------- */
.tiles{flex:none; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:1.4vw}
.tile{background:var(--surface); border:1px solid var(--line); padding:2.4vh 1.7vw; min-width:0;
      display:flex; flex-direction:column; gap:1.6vh; transition:border-color .45s ease}
.tile .lab{font-size:1.3vh; letter-spacing:.15em; text-transform:uppercase; font-weight:600;
           color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tile .val{font-family:var(--serif); font-size:8vh; font-weight:500; line-height:1;
           letter-spacing:-.02em; color:var(--ink); white-space:nowrap; overflow:hidden;
           font-feature-settings:"tnum" 1,"lnum" 1; transition:color .45s ease}
.tile.flash{border-color:var(--bronze)}
.tile.flash .val{color:var(--bronze)}

/* ---------- banner sin datos ---------- */
.banner{display:none}
.banner.show{display:flex; flex:1; flex-direction:column; align-items:center; justify-content:center;
             gap:2.6vh; text-align:center; background:var(--surface); border:1px solid var(--line)}
.banner .rule{width:64px; height:2px; background:var(--bronze)}
.banner .big{font-family:var(--serif); font-style:italic; font-size:4vh; color:var(--ink)}
.banner .small{font-size:1.8vh; color:var(--ink-3); max-width:40ch; line-height:1.65}

/* ---------- graficos ---------- */
.panels{flex:1; display:grid; grid-template-columns:1.5fr 1fr 1.15fr;
        grid-template-rows:1fr 1fr; gap:1.4vw; min-height:0; min-width:0}
.panels > *{min-width:0}
#p-hours{grid-column:1; grid-row:1 / span 2}
#p-comunas{grid-column:2; grid-row:1}
#p-fuente{grid-column:2; grid-row:2}
#p-feed{grid-column:3; grid-row:1 / span 2}

.panel{background:var(--surface); border:1px solid var(--line); overflow:hidden;
       padding:2.4vh 1.7vw; display:flex; flex-direction:column; min-height:0; min-width:0}
.panel h2{font-size:1.3vh; letter-spacing:.15em; text-transform:uppercase; font-weight:600;
          color:var(--ink-2); padding-bottom:1.4vh; margin-bottom:1.8vh;
          border-bottom:1px solid var(--line);
          display:flex; justify-content:space-between; align-items:baseline; gap:.8vw; white-space:nowrap}
.panel h2 .cap{letter-spacing:.04em; font-weight:400; color:var(--ink-3); text-transform:none}
.pbody{flex:1; display:flex; flex-direction:column; min-height:0}
.empty{margin:auto; color:var(--ink-3); font-family:var(--serif); font-style:italic; font-size:2vh}

/* barras por hora */
.hours{flex:1; display:flex; align-items:flex-end; gap:.6%; border-bottom:1px solid var(--line-strong)}
.hcol{flex:1; height:100%; display:flex; flex-direction:column; align-items:center;
      justify-content:flex-end; gap:1vh}
.hbar{width:66%; background:var(--bronze); min-height:2px; transition:height .35s ease}
.hbar.z{background:var(--line)}
.hlab{font-size:1.15vh; letter-spacing:.04em; color:var(--ink-3); font-variant-numeric:tabular-nums}

/* comunas */
.clist{flex:1; display:flex; flex-direction:column; justify-content:center; gap:2.1vh}
.crow{display:grid; grid-template-columns:9.5vw 1fr auto; gap:1vw; align-items:center; font-size:1.9vh}
.cname{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--ink)}
.ctrack{height:1.7vh; background:#EEE3DC; overflow:hidden}
.cfill{height:100%; background:var(--bronze); transition:width .35s ease}
.cval{font-size:1.6vh; color:var(--ink-2); font-variant-numeric:tabular-nums}

/* dona por fuente */
.fwrap{flex:1; display:flex; align-items:center; justify-content:center; gap:2vw}
.donut{width:15vh; height:15vh; border-radius:50%; position:relative; flex:none}
.donut::after{content:""; position:absolute; inset:30%; background:var(--surface); border-radius:50%}
.leg{display:flex; flex-direction:column; gap:1.3vh; font-size:1.5vh; color:var(--ink)}
.leg div{display:flex; align-items:center; gap:.7vw; white-space:nowrap}
.leg i{width:1.2vh; height:1.2vh; flex:none}
.leg .pct{color:var(--ink-3); font-variant-numeric:tabular-nums}

/* ultimas ventas */
.flist{flex:1; display:flex; flex-direction:column; justify-content:space-between; overflow:hidden}
.fr{display:flex; align-items:baseline; gap:1vw; padding:.5vh .2vw;
    border-bottom:1px solid var(--line); font-size:1.7vh}
.fr:last-child{border-bottom:0}
.fr .tm{color:var(--ink-3); font-variant-numeric:tabular-nums; flex:none}
.fr .cm{flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--ink)}
.fr .cm .it{font-family:var(--serif); font-style:italic; color:var(--ink-3); font-size:1.45vh}
.fr .am{flex:none; font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums}
.fr.nueva{animation:frin 1s ease-out}
@keyframes frin{
  0%{background:var(--bronze-tint); box-shadow:inset 3px 0 0 var(--bronze)}
  100%{background:transparent; box-shadow:inset 3px 0 0 transparent}
}

/* pantalla de carga */
.overlay{position:fixed; inset:0; background:var(--bg); z-index:9;
         display:flex; align-items:center; justify-content:center;
         font-family:var(--serif); font-style:italic; font-size:2.6vh; color:var(--ink-3)}
.overlay.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <span class="mark">L'Animalier</span>
      <span class="bar"></span>
      <span class="sub">Ventas en vivo · demostración</span>
    </div>
    <div class="status">
      <span class="clock" id="clock">--:--</span>
      <span class="dot" id="dot"></span>
      <span id="stxt">iniciando</span>
    </div>
  </header>

  <section class="tiles">
    <div class="tile"><div class="lab">Ventas de hoy</div><div class="val" id="v-count">—</div></div>
    <div class="tile"><div class="lab">Facturación de hoy</div><div class="val" id="v-rev">—</div></div>
    <div class="tile"><div class="lab">Ticket promedio</div><div class="val" id="v-ticket">—</div></div>
    <div class="tile"><div class="lab">Unidades vendidas</div><div class="val" id="v-units">—</div></div>
  </section>

  <div class="banner" id="banner"></div>

  <section class="panels" id="panels">
    <div class="panel" id="p-hours">
      <h2>Facturación por hora <span class="cap" id="cap-hours"></span></h2>
      <div class="pbody"><div class="hours" id="hours"></div></div>
    </div>
    <div class="panel" id="p-comunas">
      <h2>Comunas que más compran</h2>
      <div class="pbody"><div class="clist" id="comunas"></div></div>
    </div>
    <div class="panel" id="p-fuente">
      <h2>Reparto por fuente de tráfico</h2>
      <div class="pbody"><div class="fwrap"><div class="donut" id="donut"></div><div class="leg" id="leg"></div></div></div>
    </div>
    <div class="panel" id="p-feed">
      <h2>Últimas ventas</h2>
      <div class="pbody"><div class="flist" id="feed"></div></div>
    </div>
  </section>

  <div class="overlay" id="overlay">Cargando ventas de hoy…</div>
</div>

<script>
/* ============================================================
   Tablero de ventas en vivo — L'Animalier
   Diseño alineado con lanimalier.cl (Bodoni Moda + Hanken Grotesk,
   fondo crudo, esquinas rectas, bronce como acento).
   Lógica: carga el historial de hoy con una consulta normal, se
   conecta al canal en vivo (Realtime, evento INSERT) y suma sobre
   lo ya cargado; junta lo que llega y redibuja cada 0,5 s; guarda
   solo las 15 últimas ventas; si el canal en vivo falla, sigue con
   una consulta de respaldo cada 20 s. Solo clave anónima.
   ============================================================ */

const CFG = {
  url:    'https://db.lanimalier.cl',
  schema: 'lanimalier',
  table:  'ventas',
  key:    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxhbmltYWxpZXIiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc4Njc1NDcyMSwiZXhwIjoyMTAyMTE0NzIxfQ.17qeMGwPJ7KVKgiU__fYEk1UzGhqdLrBZtQ2cUeY1EU',
  tz:     'America/Santiago',
  feedMax:      15,
  renderMs:     500,
  reconcileMs:  20000,
};

/* ---------- horario de Chile ---------- */
function tzOffsetMs(date){
  const dtf = new Intl.DateTimeFormat('en-US',{timeZone:CFG.tz,hour12:false,
    year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const p={}; for(const x of dtf.formatToParts(date)) p[x.type]=x.value;
  const h = p.hour==='24' ? 0 : +p.hour;
  const asUTC = Date.UTC(+p.year,+p.month-1,+p.day,h,+p.minute,+p.second);
  return asUTC - date.getTime();
}
function dayStartUTC(date=new Date()){
  const off  = tzOffsetMs(date);
  const loc  = new Date(date.getTime()+off);
  const mid  = Date.UTC(loc.getUTCFullYear(), loc.getUTCMonth(), loc.getUTCDate());
  const off2 = tzOffsetMs(new Date(mid-off));
  return new Date(mid-off2);
}
const dayKeyFmt = new Intl.DateTimeFormat('en-CA',{timeZone:CFG.tz,year:'numeric',month:'2-digit',day:'2-digit'});
const hourFmt   = new Intl.DateTimeFormat('en-GB',{timeZone:CFG.tz,hour:'2-digit',hour12:false});
const hmFmt     = new Intl.DateTimeFormat('es-CL',{timeZone:CFG.tz,hour:'2-digit',minute:'2-digit',hour12:false});
const dayKey  = d => dayKeyFmt.format(d);
const hourOf  = d => (+hourFmt.format(d))%24;

/* ---------- formato de numeros ---------- */
function money(n){
  n = Math.round(+n||0);
  const a = Math.abs(n);
  if(a >= 1e6){ const v=n/1e6; return '$'+v.toLocaleString('es-CL',{maximumFractionDigits: Math.abs(v)<100?1:0})+' M'; }
  if(a >= 1e3){ return '$'+Math.round(n/1e3).toLocaleString('es-CL')+' K'; }
  return '$'+n.toLocaleString('es-CL');
}
const intFmt = n => (+n||0).toLocaleString('es-CL');
function ageText(sec){
  if(sec < 3600) return Math.max(1,Math.round(sec/60))+' min';
  return Math.round(sec/3600)+' h';
}

/* ---------- estado ---------- */
const S = {
  loaded:false, histError:false,
  dayStart:null, dayKey:null,
  count:0, revenue:0, units:0,
  byHour:{}, byComuna:{}, bySource:{},
  feed:[],
  seen:new Set(), watermark:0,
  pending:[],
  flashNow:null,
  ws:null, wsJoined:false, wsErr:false, wsRef:0, wsBackoff:1500, hb:null,
  evSinceReconcile:0, rtSilent:false,
  feedEls:new Map(), flashT:null,
};

/* ---------- acceso a la base ---------- */
async function restGet(pathQuery){
  const r = await fetch(`${CFG.url}/rest/v1/${pathQuery}`,{
    headers:{ apikey:CFG.key, Authorization:'Bearer '+CFG.key, 'Accept-Profile':CFG.schema }
  });
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
async function fetchPaged(qs, cap=250000){
  const PAGE=25000; let off=0, out=[];
  while(out.length < cap){
    const part = await restGet(`${qs}&limit=${PAGE}&offset=${off}`);
    out = out.concat(part);
    if(part.length < PAGE) break;
    off += PAGE;
  }
  return out;
}

/* ---------- agregar una venta a los totales ---------- */
function toPieces(v){
  if(Array.isArray(v)) return v;
  if(typeof v === 'string'){ try{ return JSON.parse(v); }catch(e){ return []; } }
  return [];
}
function applyAgg(r){
  S.count++;
  S.revenue += (+r.total||0);
  S.units   += (+r.unidades||0);
  const h = hourOf(new Date(r.ocurrido_en));
  S.byHour[h] = (S.byHour[h]||0) + (+r.total||0);
  if(r.ciudad) S.byComuna[r.ciudad] = (S.byComuna[r.ciudad]||0) + 1;
  const f = r.fuente || '(sin dato)';
  S.bySource[f] = (S.bySource[f]||0) + 1;
}
function advanceWatermark(){
  while(S.seen.has(S.watermark+1)){ S.seen.delete(S.watermark+1); S.watermark++; }
  if(S.seen.size > 50000) for(const x of S.seen) if(x <= S.watermark) S.seen.delete(x);
}
function ingest(r){
  const id = +r.id;
  if(!id || S.seen.has(id) || id <= S.watermark) return false;
  if(dayKey(new Date(r.ocurrido_en)) !== S.dayKey){ S.seen.add(id); return false; }
  S.seen.add(id);
  advanceWatermark();
  applyAgg(r);
  S.pending.push(r);
  return true;
}

/* ---------- carga inicial ---------- */
async function loadHistory(){
  S.dayStart = dayStartUTC();
  S.dayKey   = dayKey(new Date());
  const iso  = S.dayStart.toISOString();

  let rows;
  try{
    rows = await fetchPaged(
      `${CFG.table}?select=id,ocurrido_en,total,unidades,ciudad,fuente&ocurrido_en=gte.${iso}&order=id.asc`);
  }catch(e){
    S.histError = true; render();
    setTimeout(loadHistory, 5000);
    return;
  }
  S.histError = false;

  S.count=0; S.revenue=0; S.units=0; S.byHour={}; S.byComuna={}; S.bySource={};
  let maxId = 0;
  for(const r of rows){ applyAgg(r); if(+r.id > maxId) maxId = +r.id; }
  S.seen.clear();
  S.watermark = maxId;

  try{
    S.feed = await restGet(
      `${CFG.table}?select=id,ocurrido_en,total,unidades,lineas,ciudad,fuente,piezas&order=id.desc&limit=${CFG.feedMax}`);
  }catch(e){}

  S.loaded = true;
  buildFeed(true);
  render();
}

/* ---------- respaldo cada 20 s ---------- */
async function reconcile(){
  if(dayKey(new Date()) !== S.dayKey){
    S.loaded = false; S.feedEls.clear();
    document.getElementById('feed').innerHTML = '';
    await loadHistory();
    return;
  }
  let rows = [];
  try{
    rows = await fetchPaged(
      `${CFG.table}?select=id,ocurrido_en,total,unidades,ciudad,fuente&id=gt.${S.watermark}&order=id.asc`, 80000);
  }catch(e){ return; }

  let added = 0;
  for(const r of rows) if(ingest(r)) added++;

  if(S.wsJoined && !S.wsErr){
    if(added > 0 && S.evSinceReconcile === 0) S.rtSilent = true;
    else if(S.evSinceReconcile > 0)           S.rtSilent = false;
  }
  S.evSinceReconcile = 0;

  try{
    const f = await restGet(
      `${CFG.table}?select=id,ocurrido_en,total,unidades,lineas,ciudad,fuente,piezas&order=id.desc&limit=${CFG.feedMax}`);
    mergeFeed(f);
  }catch(e){}
}
function mergeFeed(list){
  const m = new Map();
  for(const r of [...list, ...S.feed]) m.set(+r.id, r);
  S.feed = [...m.values()].sort((a,b)=>b.id-a.id).slice(0, CFG.feedMax);
}

/* ---------- canal en vivo ---------- */
function connectRT(){
  let ws;
  try{ ws = new WebSocket(`${CFG.url.replace(/^https/,'wss')}/realtime/v1/websocket?apikey=${CFG.key}&vsn=1.0.0`); }
  catch(e){ scheduleRT(); return; }
  S.ws = ws;

  ws.onopen = () => {
    S.wsRef = 0;
    ws.send(JSON.stringify({
      topic:'realtime:tablero-ventas', event:'phx_join',
      payload:{ config:{ broadcast:{self:false}, presence:{key:''},
        postgres_changes:[{ event:'INSERT', schema:CFG.schema, table:CFG.table }] },
        access_token:CFG.key },
      ref:String(++S.wsRef), join_ref:'1'
    }));
    clearInterval(S.hb);
    S.hb = setInterval(() => {
      if(ws.readyState === 1)
        ws.send(JSON.stringify({topic:'phoenix',event:'heartbeat',payload:{},ref:String(++S.wsRef)}));
    }, 25000);
  };

  ws.onmessage = (m) => {
    let msg; try{ msg = JSON.parse(m.data); }catch(e){ return; }
    if(msg.topic === 'realtime:tablero-ventas' && msg.event === 'phx_reply'){
      if(msg.payload && msg.payload.status === 'ok'){ S.wsJoined = true; S.wsErr = false; S.wsBackoff = 1500; }
      else { S.wsErr = true; S.wsJoined = false; console.warn('Realtime no aceptó la suscripción:', msg.payload); }
      return;
    }
    if(msg.event === 'postgres_changes'){
      const p = msg.payload || {};
      const rec = (p.data && (p.data.record || p.data.new)) || p.record || p.new;
      if(rec && ingest(rec)) S.evSinceReconcile++;
    }
  };

  ws.onerror = () => { try{ ws.close(); }catch(e){} };
  ws.onclose = () => { S.wsJoined = false; clearInterval(S.hb); S.hb = null; scheduleRT(); };
}
function scheduleRT(){
  setTimeout(connectRT, S.wsBackoff);
  S.wsBackoff = Math.min(Math.round(S.wsBackoff*1.6), 15000);
}

/* ---------- dibujo cada 0,5 s ---------- */
function renderTick(){
  if(S.pending.length){
    S.flashNow = new Set(S.pending.map(r => +r.id));
    mergeFeed(S.pending);
    S.pending = [];
    flashTiles();
  } else {
    S.flashNow = null;
  }
  render();
}
function flashTiles(){
  const t = document.querySelectorAll('.tile');
  t.forEach(x => x.classList.add('flash'));
  clearTimeout(S.flashT);
  S.flashT = setTimeout(() => t.forEach(x => x.classList.remove('flash')), 500);
}

function set(id, txt){ const el=document.getElementById(id); if(el.textContent!==txt) el.textContent=txt; }

function render(){
  renderStatus();

  const ov = document.getElementById('overlay');
  if(!S.loaded){
    ov.classList.remove('hide');
    ov.textContent = S.histError
      ? 'No se pudo conectar con la base. Reintentando…'
      : 'Cargando ventas de hoy…';
    return;
  }
  ov.classList.add('hide');

  const zero = S.count === 0;
  set('v-count',  zero ? '—' : intFmt(S.count));
  set('v-rev',    zero ? '—' : money(S.revenue));
  set('v-ticket', zero ? '—' : money(S.revenue / S.count));
  set('v-units',  zero ? '—' : intFmt(S.units));

  const panels = document.getElementById('panels');
  const banner = document.getElementById('banner');
  if(zero){
    panels.style.display = 'none';
    banner.className = 'banner show';
    banner.innerHTML =
      '<div class="rule"></div>' +
      '<div class="big">Aún no hay ventas hoy.</div>' +
      '<div class="small">La pantalla se actualiza sola en cuanto entre la primera venta.</div>';
    return;
  }
  panels.style.display = 'grid';
  banner.className = 'banner';

  renderHours();
  renderComunas();
  renderFuente();
  buildFeed(false);
}

function renderStatus(){
  const dot = document.getElementById('dot');
  const txt = document.getElementById('stxt');
  let cls, t;
  if(S.wsErr){          cls='warn'; t='sin canal en vivo · datos cada 20 s'; }
  else if(!S.wsJoined){ cls='warn'; t='reconectando · datos cada 20 s'; }
  else if(S.rtSilent){  cls='warn'; t='en vivo con retraso · datos cada 20 s'; }
  else {                cls='live'; t='en vivo'; }

  if(S.loaded && S.count > 0 && S.feed[0]){
    const age = (Date.now() - new Date(S.feed[0].ocurrido_en).getTime())/1000;
    if(age > 90) t += ' · última venta hace ' + ageText(age);
  }
  dot.className = 'dot ' + cls;
  if(txt.textContent !== t) txt.textContent = t;
}

function renderHours(){
  const box = document.getElementById('hours');
  const nowH = hourOf(new Date());
  let maxH = nowH;
  for(const k of Object.keys(S.byHour)) maxH = Math.max(maxH, +k);
  const vals = [];
  for(let h=0; h<=maxH; h++) vals.push(S.byHour[h]||0);
  const peak = Math.max(1, ...vals);
  const step = vals.length > 14 ? 2 : 1;
  box.innerHTML = vals.map((v,h) => `
    <div class="hcol">
      <div class="hbar${v?'':' z'}" style="height:${Math.max(v/peak*100, v?3:0)}%"></div>
      <div class="hlab">${h%step===0 ? String(h).padStart(2,'0') : ''}</div>
    </div>`).join('');
  document.getElementById('cap-hours').textContent = 'punta ' + money(peak);
}

function renderComunas(){
  const box = document.getElementById('comunas');
  const top = Object.entries(S.byComuna).sort((a,b)=>b[1]-a[1]).slice(0,5);
  if(!top.length){ box.innerHTML = '<div class="empty">Sin datos todavía</div>'; return; }
  const mx = Math.max(1, ...top.map(x=>x[1]));
  box.innerHTML = top.map(([name,v]) => `
    <div class="crow">
      <span class="cname">${esc(name)}</span>
      <span class="ctrack"><span class="cfill" style="width:${v/mx*100}%"></span></span>
      <span class="cval">${intFmt(v)}</span>
    </div>`).join('');
}

function renderFuente(){
  const donut = document.getElementById('donut');
  const leg   = document.getElementById('leg');
  let ent = Object.entries(S.bySource).sort((a,b)=>b[1]-a[1]);
  if(!ent.length){ donut.style.background='var(--line)'; leg.innerHTML=''; return; }
  if(ent.length > 5){
    const head = ent.slice(0,4);
    const rest = ent.slice(4).reduce((s,x)=>s+x[1],0);
    ent = [...head, ['otros', rest]];
  }
  const total  = ent.reduce((s,x)=>s+x[1],0) || 1;
  const shades = ['#5E4A18','#877039','#B39A63','#CDB78C','#E4D6B8'];
  let acc = 0;
  const stops = ent.map((x,i) => {
    const a = acc/total*360; acc += x[1]; const b = acc/total*360;
    return `${shades[i]} ${a}deg ${b}deg`;
  });
  donut.style.background = `conic-gradient(${stops.join(',')})`;
  leg.innerHTML = ent.map((x,i) => `
    <div><i style="background:${shades[i]}"></i>${esc(x[0])}
      <span class="pct">· ${Math.round(x[1]/total*100)}%</span></div>`).join('');
}

/* lista de ventas: elementos con identidad, solo las nuevas destellan */
function buildFeed(fresh){
  const box = document.getElementById('feed');
  if(fresh){ box.innerHTML = ''; S.feedEls.clear(); }
  const want = S.feed;
  const wantIds = new Set(want.map(r => +r.id));

  for(const [id,el] of S.feedEls){
    if(!wantIds.has(id)){ el.remove(); S.feedEls.delete(id); }
  }
  for(const r of want){
    const id = +r.id;
    if(!S.feedEls.has(id)){
      const el = feedRow(r);
      if(!fresh && S.flashNow && S.flashNow.has(id)){
        el.classList.add('nueva');
        setTimeout(() => el.classList.remove('nueva'), 1100);
      }
      S.feedEls.set(id, el);
    }
  }
  for(const r of want) box.appendChild(S.feedEls.get(+r.id));
}
function feedRow(r){
  const pz = toPieces(r.piezas);
  const first = pz[0] ? pz[0].nombre : '';
  const more  = pz.length > 1 ? ' +' + (pz.length-1) : '';
  const el = document.createElement('div');
  el.className = 'fr';
  el.innerHTML =
    `<span class="tm">${hmFmt.format(new Date(r.ocurrido_en))}</span>` +
    `<span class="cm">${esc(r.ciudad||'—')}` +
      (first ? ` <span class="it">· ${esc(first)}${more}</span>` : '') + `</span>` +
    `<span class="am">${money(r.total)}</span>`;
  return el;
}

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function tick(){ document.getElementById('clock').textContent = hmFmt.format(new Date()); }

/* ---------- arranque ---------- */
render();
tick(); setInterval(tick, 15000);
loadHistory().then(connectRT);
setInterval(renderTick,  CFG.renderMs);
setInterval(reconcile,   CFG.reconcileMs);
</script>
