<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal Room · L'Animalier</title>
<meta name="color-scheme" content="dark">
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Syne:wght@500;700;800&display=swap');

:root{
  --bg:#07111f;
  --bg-2:#0a1630;
  --bg-3:#14284b;
  --surface:rgba(10,20,38,.72);
  --surface-strong:rgba(13,25,46,.9);
  --surface-soft:rgba(143,227,255,.08);
  --line:rgba(157,210,255,.14);
  --line-strong:rgba(157,210,255,.28);
  --text:#eef6ff;
  --muted:#8aa7c7;
  --muted-2:#6883a5;
  --cyan:#7de2ff;
  --aqua:#45c4ff;
  --lime:#b7ff7a;
  --rose:#ff8ad8;
  --amber:#ffc46b;
  --shadow:0 20px 70px rgba(0,0,0,.35);
  --radius:28px;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  min-height:100vh;
  font-family:'Space Grotesk',system-ui,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at top left, rgba(69,196,255,.23), transparent 28%),
    radial-gradient(circle at top right, rgba(183,255,122,.14), transparent 24%),
    radial-gradient(circle at 50% 120%, rgba(255,138,216,.18), transparent 30%),
    linear-gradient(135deg, var(--bg), var(--bg-2) 42%, var(--bg-3));
  overflow:hidden;
}

body::before,
body::after{
  content:"";
  position:fixed;
  inset:auto;
  pointer-events:none;
  z-index:0;
}

body::before{
  top:-12rem;
  left:-8rem;
  width:30rem;
  height:30rem;
  border-radius:50%;
  background:radial-gradient(circle, rgba(125,226,255,.22), transparent 68%);
  filter:blur(12px);
}

body::after{
  right:-10rem;
  bottom:-12rem;
  width:34rem;
  height:34rem;
  border-radius:50%;
  background:radial-gradient(circle, rgba(183,255,122,.14), transparent 70%);
  filter:blur(24px);
}

#app{position:relative; z-index:1; height:100%}

.shell{
  height:100vh;
  padding:24px;
}

.board{
  height:100%;
  display:grid;
  grid-template-rows:auto auto 1fr;
  gap:18px;
}

.glass{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  backdrop-filter:blur(18px) saturate(120%);
  -webkit-backdrop-filter:blur(18px) saturate(120%);
}

.hero{
  padding:22px 24px;
  display:grid;
  grid-template-columns:minmax(0,1.4fr) minmax(320px,.9fr);
  gap:18px;
  align-items:stretch;
}

.hero-copy{
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  gap:12px;
}

.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:10px;
  color:var(--cyan);
  letter-spacing:.22em;
  text-transform:uppercase;
  font-size:11px;
  font-weight:700;
}

.pulse{
  width:10px;
  height:10px;
  border-radius:999px;
  background:var(--lime);
  box-shadow:0 0 0 0 rgba(183,255,122,.55);
  animation:pulse 1.8s infinite;
}

@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(183,255,122,.45)}
  70%{box-shadow:0 0 0 18px rgba(183,255,122,0)}
  100%{box-shadow:0 0 0 0 rgba(183,255,122,0)}
}

.hero h1{
  margin:0;
  font-family:'Syne','Space Grotesk',sans-serif;
  font-size:clamp(2rem,4vw,4.2rem);
  line-height:.95;
  letter-spacing:-.05em;
}

.hero p{
  margin:0;
  color:var(--muted);
  max-width:60ch;
  line-height:1.5;
  font-size:15px;
}

.hero-meta{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.chip{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:10px 14px;
  border-radius:999px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);
  color:var(--text);
  font-size:12px;
}

.hero-status{
  padding:18px;
  border-radius:24px;
  background:
    linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.01)),
    rgba(6,14,27,.55);
  border:1px solid rgba(125,226,255,.16);
  display:grid;
  grid-template-rows:auto 1fr;
  gap:16px;
}

.status-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
}

.status-label{
  font-size:11px;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--muted);
  font-weight:700;
}

.status-copy{
  margin-top:8px;
  font-size:20px;
  font-weight:700;
  line-height:1.1;
}

.clock{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color:var(--cyan);
  font-size:14px;
}

.status-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.status-card{
  padding:14px;
  border-radius:18px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.06);
}

.status-card b{
  display:block;
  font-size:24px;
  margin-top:4px;
}

.metrics{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:18px;
}

.metric{
  padding:18px 18px 20px;
  position:relative;
  overflow:hidden;
}

.metric::before{
  content:"";
  position:absolute;
  inset:0 auto auto 0;
  width:100%;
  height:2px;
  background:linear-gradient(90deg, transparent, var(--cyan), transparent);
  opacity:.45;
}

.metric-label{
  color:var(--muted);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.2em;
  font-weight:700;
}

.metric-value{
  margin-top:12px;
  font-family:'Syne','Space Grotesk',sans-serif;
  font-size:clamp(2rem,3vw,3.4rem);
  line-height:.95;
  letter-spacing:-.05em;
}

.metric-delta{
  margin-top:10px;
  color:var(--muted);
  font-size:13px;
}

.flash{
  animation:flashCard .65s ease;
}

@keyframes flashCard{
  0%{transform:translateY(-2px); border-color:rgba(183,255,122,.5); box-shadow:0 0 0 1px rgba(183,255,122,.35), var(--shadow)}
  100%{transform:none; border-color:var(--line); box-shadow:var(--shadow)}
}

.layout{
  min-height:0;
  display:grid;
  grid-template-columns:1.5fr 1.05fr .95fr;
  grid-template-rows:1fr 1fr;
  gap:18px;
}

.panel{
  min-height:0;
  padding:18px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.panel-header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  margin-bottom:16px;
}

.panel-title{
  margin:0;
  font-size:13px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--muted);
}

.panel-subtitle{
  margin-top:6px;
  color:var(--text);
  font-size:22px;
  font-weight:700;
}

.panel-kicker{
  color:var(--muted-2);
  font-size:12px;
  max-width:20ch;
  text-align:right;
}

.chart-wrap{
  flex:1;
  min-height:0;
}

.hours-panel{grid-row:1 / span 2}
.feed-panel{grid-row:1 / span 2}

.empty{
  height:100%;
  display:grid;
  place-items:center;
  text-align:center;
  color:var(--muted);
  border:1px dashed rgba(255,255,255,.09);
  border-radius:22px;
  background:rgba(255,255,255,.02);
}

.empty b{
  display:block;
  color:var(--text);
  margin-bottom:6px;
}

.feed{
  display:flex;
  flex-direction:column;
  gap:10px;
  overflow:auto;
  padding-right:4px;
}

.feed::-webkit-scrollbar{width:8px}
.feed::-webkit-scrollbar-thumb{background:rgba(125,226,255,.16); border-radius:999px}

.feed-row{
  display:grid;
  grid-template-columns:auto 1fr auto;
  gap:12px;
  align-items:center;
  padding:14px 16px;
  border-radius:18px;
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.06);
}

.feed-row.new{
  border-color:rgba(183,255,122,.28);
  background:linear-gradient(90deg, rgba(183,255,122,.10), rgba(255,255,255,.03) 30%);
}

.feed-time{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:12px;
  color:var(--cyan);
}

.feed-main{min-width:0}

.feed-city{
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.feed-item{
  margin-top:4px;
  color:var(--muted);
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.feed-amount{
  font-weight:700;
  font-size:17px;
}

.footer-banner{
  position:fixed;
  left:24px;
  right:24px;
  bottom:24px;
  padding:16px 18px;
  border-radius:20px;
  background:rgba(5,10,19,.84);
  border:1px solid rgba(255,255,255,.08);
  box-shadow:var(--shadow);
  display:flex;
  justify-content:space-between;
  gap:16px;
  align-items:center;
  z-index:10;
}

.footer-banner strong{display:block; margin-bottom:4px}
.footer-banner span{color:var(--muted); font-size:14px}

.legend-row{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.legend-pill{
  padding:7px 10px;
  border-radius:999px;
  font-size:12px;
  color:var(--text);
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.06);
}

.overlay{
  position:fixed;
  inset:0;
  display:grid;
  place-items:center;
  background:rgba(4,9,17,.74);
  backdrop-filter:blur(12px);
  z-index:20;
}

.overlay-card{
  width:min(92vw,520px);
  padding:28px;
  border-radius:28px;
  text-align:center;
  background:rgba(8,16,28,.92);
  border:1px solid rgba(125,226,255,.16);
  box-shadow:var(--shadow);
}

.overlay-card h2{
  margin:0 0 10px;
  font-family:'Syne','Space Grotesk',sans-serif;
  font-size:clamp(1.8rem,3vw,2.8rem);
  letter-spacing:-.05em;
}

.overlay-card p{
  margin:0;
  color:var(--muted);
  line-height:1.5;
}

@media (max-width: 1260px){
  body{overflow:auto}
  .shell{height:auto; min-height:100vh}
  .board{height:auto}
  .hero{grid-template-columns:1fr}
  .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
  .layout{
    grid-template-columns:1fr;
    grid-template-rows:auto;
  }
  .hours-panel,.feed-panel{grid-row:auto}
  .panel{min-height:420px}
  .footer-banner{
    position:static;
    margin-top:16px;
  }
}

@media (max-width: 720px){
  .shell{padding:14px}
  .hero,.panel,.metric{padding:16px}
  .metrics{grid-template-columns:1fr}
  .status-grid{grid-template-columns:1fr}
  .feed-row{grid-template-columns:1fr; align-items:flex-start}
}
</style>
</head>
<body>
<div id="app"></div>

<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "htm": "https://esm.sh/htm@3.1.1",
    "recharts": "https://esm.sh/recharts@2.15.4?external=react,react-dom"
  }
}
</script>
<script type="module">
import React, { useEffect, useMemo, useRef, useState } from "react";
import { createRoot } from "react-dom/client";
import htm from "htm";
import {
  ResponsiveContainer,
  AreaChart,
  Area,
  XAxis,
  YAxis,
  Tooltip,
  CartesianGrid,
  BarChart,
  Bar,
  PieChart,
  Pie,
  Cell
} from "recharts";

const html = htm.bind(React.createElement);

const CFG = {
  url: "https://db.lanimalier.cl",
  schema: "lanimalier",
  table: "ventas",
  key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxhbmltYWxpZXIiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc4Njc1NDcyMSwiZXhwIjoyMTAyMTE0NzIxfQ.17qeMGwPJ7KVKgiU__fYEk1UzGhqdLrBZtQ2cUeY1EU",
  tz: "America/Santiago",
  feedMax: 15,
  renderMs: 500,
  reconcileMs: 20000,
  palette: ["#7DE2FF", "#B7FF7A", "#FF8AD8", "#FFC46B", "#45C4FF"]
};

const CLP = new Intl.NumberFormat("es-CL", { style: "currency", currency: "CLP", maximumFractionDigits: 0 });
const INT = new Intl.NumberFormat("es-CL");
const DAY_KEY_FMT = new Intl.DateTimeFormat("en-CA", { timeZone: CFG.tz, year: "numeric", month: "2-digit", day: "2-digit" });
const HOUR_FMT = new Intl.DateTimeFormat("en-GB", { timeZone: CFG.tz, hour: "2-digit", hour12: false });
const HM_FMT = new Intl.DateTimeFormat("es-CL", { timeZone: CFG.tz, hour: "2-digit", minute: "2-digit", hour12: false });

function tzOffsetMs(date) {
  const dtf = new Intl.DateTimeFormat("en-US", {
    timeZone: CFG.tz,
    hour12: false,
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit"
  });
  const parts = {};
  for (const piece of dtf.formatToParts(date)) parts[piece.type] = piece.value;
  const h = parts.hour === "24" ? 0 : +parts.hour;
  const asUTC = Date.UTC(+parts.year, +parts.month - 1, +parts.day, h, +parts.minute, +parts.second);
  return asUTC - date.getTime();
}

function dayStartUTC(date = new Date()) {
  const off = tzOffsetMs(date);
  const local = new Date(date.getTime() + off);
  const midnight = Date.UTC(local.getUTCFullYear(), local.getUTCMonth(), local.getUTCDate());
  const off2 = tzOffsetMs(new Date(midnight - off));
  return new Date(midnight - off2);
}

const dayKey = (date) => DAY_KEY_FMT.format(date);
const hourOf = (date) => (+HOUR_FMT.format(date)) % 24;
const moneyCompact = (n) => {
  const value = Math.round(+n || 0);
  const abs = Math.abs(value);
  if (abs >= 1e9) return `$${(value / 1e9).toLocaleString("es-CL", { maximumFractionDigits: 1 })} B`;
  if (abs >= 1e6) return `$${(value / 1e6).toLocaleString("es-CL", { maximumFractionDigits: Math.abs(value / 1e6) < 100 ? 1 : 0 })} M`;
  if (abs >= 1e3) return `$${Math.round(value / 1e3).toLocaleString("es-CL")} K`;
  return `$${value.toLocaleString("es-CL")}`;
};
const alpha = (hex, opacity) => {
  const value = hex.replace("#", "");
  const normalized = value.length === 3 ? value.split("").map((x) => x + x).join("") : value;
  const num = parseInt(normalized, 16);
  const r = (num >> 16) & 255;
  const g = (num >> 8) & 255;
  const b = num & 255;
  return `rgba(${r}, ${g}, ${b}, ${opacity})`;
};

function pickItemName(row) {
  if (Array.isArray(row.piezas) && row.piezas.length) {
    const piece = row.piezas[0];
    return piece?.nombre || piece?.title || piece?.sku || "Selección curada";
  }
  if (typeof row.piezas === "string") {
    try {
      const parsed = JSON.parse(row.piezas);
      if (Array.isArray(parsed) && parsed.length) {
        const piece = parsed[0];
        return piece?.nombre || piece?.title || piece?.sku || "Selección curada";
      }
    } catch {}
  }
  if (row.lineas && Array.isArray(row.lineas) && row.lineas.length) {
    return row.lineas[0]?.nombre || row.lineas[0]?.title || "Selección curada";
  }
  return "Selección curada";
}

function createEmptyState() {
  const start = dayStartUTC();
  return {
    loaded: false,
    histError: false,
    dayStart: start,
    dayKey: dayKey(start),
    count: 0,
    revenue: 0,
    units: 0,
    byHour: {},
    byComuna: {},
    bySource: {},
    feed: [],
    seen: new Set(),
    watermark: 0,
    pending: [],
    flashIds: [],
    ws: null,
    wsJoined: false,
    wsErr: false,
    wsBackoff: 1500,
    heartbeat: null,
    rtSilent: false,
    evSinceReconcile: 0,
    lastMessageAt: 0,
    clock: new Date(),
    syncAt: null
  };
}

function createStore() {
  let state = createEmptyState();
  const listeners = new Set();

  const emit = () => {
    const snapshot = {
      ...state,
      seen: undefined,
      pending: undefined,
      ws: undefined,
      heartbeat: undefined
    };
    listeners.forEach((listener) => listener(snapshot));
  };

  const restGet = async (pathQuery) => {
    const response = await fetch(`${CFG.url}/rest/v1/${pathQuery}`, {
      headers: {
        apikey: CFG.key,
        Authorization: `Bearer ${CFG.key}`,
        "Accept-Profile": CFG.schema
      }
    });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    return response.json();
  };

  const fetchPaged = async (qs, cap = 250000) => {
    const pageSize = 25000;
    let offset = 0;
    const out = [];
    while (out.length < cap) {
      const page = await restGet(`${CFG.table}?${qs}&limit=${pageSize}&offset=${offset}`);
      out.push(...page);
      if (page.length < pageSize) break;
      offset += page.length;
    }
    return out;
  };

  const refreshDayIfNeeded = () => {
    const nextStart = dayStartUTC();
    const nextKey = dayKey(nextStart);
    if (nextKey !== state.dayKey) {
      state = { ...createEmptyState(), clock: new Date() };
      emit();
      loadHistory();
    }
  };

  const applyRow = (row, fresh = false) => {
    const id = +row.id;
    if (!Number.isFinite(id)) return;
    if (state.seen.has(id)) return;
    const happened = new Date(row.ocurrido_en);
    if (dayKey(happened) !== state.dayKey) return;

    state.seen.add(id);
    state.watermark = Math.max(state.watermark, id);

    const total = Math.round(+row.total || 0);
    const units = Math.round(+row.unidades || 0);
    const hour = hourOf(happened);
    const comuna = (row.ciudad || "Sin comuna").trim() || "Sin comuna";
    const source = (row.fuente || "Sin fuente").trim() || "Sin fuente";

    state.count += 1;
    state.revenue += total;
    state.units += units;
    state.byHour[hour] = (state.byHour[hour] || 0) + total;
    state.byComuna[comuna] = (state.byComuna[comuna] || 0) + 1;
    state.bySource[source] = (state.bySource[source] || 0) + 1;

    const feedRow = {
      id,
      time: HM_FMT.format(happened),
      city: comuna,
      source,
      item: pickItemName(row),
      amount: total,
      fresh
    };

    state.feed = [feedRow, ...state.feed.filter((item) => item.id !== id)].slice(0, CFG.feedMax);
    if (!fresh) state.pending.push(row);

    if (state.seen.size > 50000) {
      for (const seenId of state.seen) {
        if (seenId <= state.watermark) state.seen.delete(seenId);
      }
    }
  };

  const mergeLatestFeed = async () => {
    const latest = await restGet(`${CFG.table}?select=id,ocurrido_en,total,unidades,lineas,ciudad,fuente,piezas&order=id.desc&limit=${CFG.feedMax}`);
    const merged = new Map(state.feed.map((entry) => [entry.id, entry]));
    for (const row of latest) {
      const happened = new Date(row.ocurrido_en);
      if (dayKey(happened) !== state.dayKey) continue;
      merged.set(+row.id, {
        id: +row.id,
        time: HM_FMT.format(happened),
        city: (row.ciudad || "Sin comuna").trim() || "Sin comuna",
        source: (row.fuente || "Sin fuente").trim() || "Sin fuente",
        item: pickItemName(row),
        amount: Math.round(+row.total || 0),
        fresh: false
      });
    }
    state.feed = [...merged.values()].sort((a, b) => b.id - a.id).slice(0, CFG.feedMax);
  };

  const loadHistory = async () => {
    refreshDayIfNeeded();
    state.histError = false;
    state.dayStart = dayStartUTC();
    state.dayKey = dayKey(state.dayStart);
    emit();
    try {
      const from = state.dayStart.toISOString();
      const rows = await fetchPaged(
        `select=id,ocurrido_en,total,unidades,lineas,ciudad,fuente,piezas&ocurrido_en=gte.${encodeURIComponent(from)}&order=id.asc`
      );
      state.count = 0;
      state.revenue = 0;
      state.units = 0;
      state.byHour = {};
      state.byComuna = {};
      state.bySource = {};
      state.feed = [];
      state.seen = new Set();
      state.watermark = 0;
      for (const row of rows) applyRow(row, true);
      await mergeLatestFeed();
      state.loaded = true;
      state.syncAt = new Date();
      emit();
    } catch (error) {
      console.error("No se pudo cargar el historial inicial", error);
      state.histError = true;
      state.loaded = true;
      emit();
      setTimeout(loadHistory, 5000);
    }
  };

  const reconcile = async () => {
    refreshDayIfNeeded();
    try {
      const from = state.dayStart.toISOString();
      const rows = await fetchPaged(
        `select=id,ocurrido_en,total,unidades,lineas,ciudad,fuente,piezas&ocurrido_en=gte.${encodeURIComponent(from)}&order=id.asc`
      );
      for (const row of rows) applyRow(row, true);
      await mergeLatestFeed();
      state.evSinceReconcile = 0;
      state.rtSilent = false;
      state.syncAt = new Date();
      emit();
    } catch (error) {
      console.warn("Falló la reconciliación", error);
    }
  };

  const setRealtimeStatus = () => {
    const elapsed = Date.now() - state.lastMessageAt;
    state.rtSilent = state.wsJoined && state.lastMessageAt > 0 && elapsed > CFG.reconcileMs * 1.5;
  };

  const connectRealtime = () => {
    try {
      const ws = new WebSocket(`${CFG.url.replace(/^https/, "wss")}/realtime/v1/websocket?apikey=${CFG.key}&vsn=1.0.0`);
      state.ws = ws;

      ws.onopen = () => {
        state.wsErr = false;
        ws.send(JSON.stringify({ topic: "realtime:public", event: "phx_join", payload: {}, ref: "1" }));
        ws.send(JSON.stringify({
          topic: `realtime:${CFG.schema}:${CFG.table}`,
          event: "phx_join",
          payload: { config: { postgres_changes: [{ event: "INSERT", schema: CFG.schema, table: CFG.table }] } },
          ref: "2"
        }));
        if (state.heartbeat) clearInterval(state.heartbeat);
        state.heartbeat = setInterval(() => {
          if (ws.readyState === 1) ws.send(JSON.stringify({ topic: "phoenix", event: "heartbeat", payload: {}, ref: String(Date.now()) }));
        }, 25000);
      };

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.event === "phx_reply" && msg.ref === "2") {
          if (msg.payload?.status === "ok") {
            state.wsJoined = true;
            state.wsErr = false;
            state.wsBackoff = 1500;
            emit();
          } else {
            state.wsErr = true;
            state.wsJoined = false;
            emit();
          }
          return;
        }
        if (msg.event === "postgres_changes" && msg.payload?.data?.record) {
          state.lastMessageAt = Date.now();
          state.evSinceReconcile += 1;
          applyRow(msg.payload.data.record, false);
        }
      };

      ws.onerror = () => {
        state.wsErr = true;
        state.wsJoined = false;
        emit();
      };

      ws.onclose = () => {
        if (state.heartbeat) clearInterval(state.heartbeat);
        state.wsJoined = false;
        state.wsErr = true;
        emit();
        state.wsBackoff = Math.min(Math.round(state.wsBackoff * 1.6), 15000);
        setTimeout(connectRealtime, state.wsBackoff);
      };
    } catch (error) {
      console.warn("No se pudo abrir realtime", error);
      state.wsErr = true;
      state.wsJoined = false;
      emit();
      state.wsBackoff = Math.min(Math.round(state.wsBackoff * 1.6), 15000);
      setTimeout(connectRealtime, state.wsBackoff);
    }
  };

  const renderTick = () => {
    state.clock = new Date();
    if (state.pending.length) {
      state.flashIds = state.pending.map((row) => +row.id);
      state.pending = [];
      emit();
      setTimeout(() => {
        state.flashIds = [];
        emit();
      }, 1200);
    } else {
      setRealtimeStatus();
      emit();
    }
  };

  let timersStarted = false;
  const start = () => {
    if (timersStarted) return;
    timersStarted = true;
    loadHistory();
    connectRealtime();
    setInterval(renderTick, CFG.renderMs);
    setInterval(reconcile, CFG.reconcileMs);
    setInterval(refreshDayIfNeeded, 15000);
  };

  return {
    subscribe(listener) {
      listeners.add(listener);
      listener({
        ...state,
        seen: undefined,
        pending: undefined,
        ws: undefined,
        heartbeat: undefined
      });
      return () => listeners.delete(listener);
    },
    start
  };
}

const store = createStore();

function useDashboardState() {
  const [snapshot, setSnapshot] = useState(null);
  useEffect(() => store.subscribe(setSnapshot), []);
  useEffect(() => {
    store.start();
  }, []);
  return snapshot;
}

function formatStatus(state) {
  if (state.histError) return { text: "Reconstruyendo desde respaldo", accent: "var(--amber)" };
  if (state.wsErr) return { text: "Sin canal vivo · respaldo cada 20 s", accent: "var(--rose)" };
  if (!state.wsJoined) return { text: "Conectando stream de eventos", accent: "var(--amber)" };
  if (state.rtSilent) return { text: "Canal con retraso · cobertura activa", accent: "var(--amber)" };
  return { text: "Realtime activo · latencia baja", accent: "var(--lime)" };
}

function deriveView(state) {
  const ticket = state.count ? Math.round(state.revenue / state.count) : 0;
  const avgUnits = state.count ? (state.units / state.count).toFixed(1) : "0.0";
  const hourly = Array.from({ length: 24 }, (_, hour) => ({
    hour: `${String(hour).padStart(2, "0")}h`,
    revenue: state.byHour[hour] || 0
  }));
  const comunas = Object.entries(state.byComuna)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 5)
    .map(([name, value]) => ({ name, value }));
  const sources = Object.entries(state.bySource)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 5)
    .map(([name, value], index) => ({
      name,
      value,
      fill: CFG.palette[index % CFG.palette.length]
    }));
  const maxHour = Math.max(...hourly.map((entry) => entry.revenue), 0);
  const lastSale = state.feed[0];
  return {
    ticket,
    avgUnits,
    hourly,
    comunas,
    sources,
    maxHour,
    lastSale
  };
}

function Panel({ title, subtitle, kicker, children, className = "" }) {
  return html`
    <section className=${`panel glass ${className}`}>
      <div className="panel-header">
        <div>
          <h2 className="panel-title">${title}</h2>
          <div className="panel-subtitle">${subtitle}</div>
        </div>
        ${kicker ? html`<div className="panel-kicker">${kicker}</div>` : null}
      </div>
      <div className="chart-wrap">${children}</div>
    </section>
  `;
}

function MetricCard({ label, value, delta, flash }) {
  return html`
    <article className=${`metric glass ${flash ? "flash" : ""}`}>
      <div className="metric-label">${label}</div>
      <div className="metric-value">${value}</div>
      <div className="metric-delta">${delta}</div>
    </article>
  `;
}

function EmptyState({ title, detail }) {
  return html`<div className="empty"><div><b>${title}</b><span>${detail}</span></div></div>`;
}

function CustomTooltip({ active, payload, label, formatter = moneyCompact }) {
  if (!active || !payload?.length) return null;
  return html`
    <div style=${{
      background: "rgba(6,12,24,.94)",
      border: "1px solid rgba(125,226,255,.16)",
      borderRadius: "16px",
      padding: "10px 12px",
      boxShadow: "0 18px 40px rgba(0,0,0,.35)"
    }}>
      <div style=${{ color: "var(--muted)", fontSize: "12px", marginBottom: "6px" }}>${label}</div>
      ${payload.map((entry, index) => html`
        <div key=${index} style=${{ color: "var(--text)", fontSize: "14px", fontWeight: 700 }}>
          ${formatter(entry.value)}
        </div>
      `)}
    </div>
  `;
}

function App() {
  const state = useDashboardState();
  const visibleRef = useRef(true);

  useEffect(() => {
    const onVisibility = () => {
      visibleRef.current = !document.hidden;
    };
    document.addEventListener("visibilitychange", onVisibility);
    return () => document.removeEventListener("visibilitychange", onVisibility);
  }, []);

  const view = useMemo(() => (state ? deriveView(state) : null), [state]);
  if (!state || !view) return null;

  const status = formatStatus(state);
  const totalSourceEvents = Object.values(state.bySource).reduce((sum, value) => sum + value, 0);
  const flashActive = state.flashIds.length > 0;

  return html`
    <div className="shell">
      <div className="board">
        <section className="hero glass">
          <div className="hero-copy">
            <div>
              <div className="eyebrow">
                <span className="pulse"></span>
                Signal Room 2026
              </div>
              <h1>Ventas en vivo con pulso de operación y lectura de sala.</h1>
            </div>
            <p>
              Un tablero diseñado para distancia, ritmo y demo pública: detecta movimiento en tiempo real,
              resiste ráfagas y transforma el flujo de ventas en una superficie más clara, más aspiracional
              y mucho más tecnológica.
            </p>
            <div className="hero-meta">
              <div className="chip">Fuente: Supabase autoalojada</div>
              <div className="chip">Modo: streaming + reconciliación</div>
              <div className="chip">Feed máximo: ${CFG.feedMax} ventas</div>
            </div>
          </div>

          <aside className="hero-status">
            <div className="status-top">
              <div>
                <div className="status-label">Estado del sistema</div>
                <div className="status-copy" style=${{ color: status.accent }}>${status.text}</div>
              </div>
              <div className="clock">${HM_FMT.format(state.clock)}</div>
            </div>
            <div className="status-grid">
              <div className="status-card">
                <div className="status-label">Última venta</div>
                <b>${view.lastSale ? view.lastSale.time : "--:--"}</b>
              </div>
              <div className="status-card">
                <div className="status-label">Promedio unidades</div>
                <b>${view.avgUnits}</b>
              </div>
              <div className="status-card">
                <div className="status-label">Fuentes activas</div>
                <b>${Object.keys(state.bySource).length}</b>
              </div>
              <div className="status-card">
                <div className="status-label">Última sync</div>
                <b>${state.syncAt ? HM_FMT.format(state.syncAt) : "--:--"}</b>
              </div>
            </div>
          </aside>
        </section>

        <section className="metrics">
          <${MetricCard}
            label="Ventas de hoy"
            value=${INT.format(state.count)}
            delta=${`${totalSourceEvents ? totalSourceEvents : 0} eventos consolidados hoy`}
            flash=${flashActive}
          />
          <${MetricCard}
            label="Facturación"
            value=${moneyCompact(state.revenue)}
            delta=${CLP.format(state.revenue)}
            flash=${flashActive}
          />
          <${MetricCard}
            label="Ticket promedio"
            value=${moneyCompact(view.ticket)}
            delta=${`Ticket medio por orden hoy`}
            flash=${flashActive}
          />
          <${MetricCard}
            label="Unidades vendidas"
            value=${INT.format(state.units)}
            delta=${`${view.avgUnits} unidades por venta`}
            flash=${flashActive}
          />
        </section>

        <main className="layout">
          <${Panel}
            title="Revenue Flow"
            subtitle="Mapa horario de facturación"
            kicker=${`Pico del día: ${moneyCompact(view.maxHour)}`}
            className="hours-panel"
          >
            ${state.count ? html`
              <${ResponsiveContainer} width="100%" height="100%">
                <${AreaChart} data=${view.hourly} margin=${{ top: 12, right: 12, left: -18, bottom: 0 }}>
                  <defs>
                    <linearGradient id="areaRevenue" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0%" stopColor="#7DE2FF" stopOpacity=${0.45} />
                      <stop offset="100%" stopColor="#7DE2FF" stopOpacity=${0.02} />
                    </linearGradient>
                  </defs>
                  <CartesianGrid stroke=${alpha("#7DE2FF", 0.09)} vertical=${false} />
                  <XAxis dataKey="hour" tick=${{ fill: "#8aa7c7", fontSize: 12 }} axisLine=${false} tickLine=${false} />
                  <YAxis tick=${{ fill: "#6883a5", fontSize: 12 }} axisLine=${false} tickLine=${false} tickFormatter=${moneyCompact} />
                  <Tooltip content=${(props) => CustomTooltip({ ...props, formatter: moneyCompact })} />
                  <Area type="monotone" dataKey="revenue" stroke="#7DE2FF" strokeWidth=${3} fill="url(#areaRevenue)" />
                </${AreaChart}>
              </${ResponsiveContainer}>
            ` : html`<${EmptyState} title="Aún no entra señal de ventas" detail="Cuando aparezcan eventos, el mapa horario encenderá el pulso del día." />`}
          </${Panel}>

          <${Panel}
            title="Top comunas"
            subtitle="Dónde está pasando la demanda"
            kicker="Ranking por cantidad de compras"
          >
            ${view.comunas.length ? html`
              <${ResponsiveContainer} width="100%" height="100%">
                <${BarChart} data=${view.comunas} layout="vertical" margin=${{ top: 4, right: 12, left: 18, bottom: 4 }}>
                  <CartesianGrid stroke=${alpha("#7DE2FF", 0.08)} horizontal=${false} />
                  <XAxis type="number" tick=${{ fill: "#6883a5", fontSize: 12 }} axisLine=${false} tickLine=${false} />
                  <YAxis dataKey="name" type="category" width=${92} tick=${{ fill: "#eef6ff", fontSize: 12 }} axisLine=${false} tickLine=${false} />
                  <Tooltip content=${(props) => CustomTooltip({ ...props, formatter: (v) => `${INT.format(v)} ventas` })} />
                  <Bar dataKey="value" radius=${[0, 12, 12, 0]}>
                    ${view.comunas.map((entry, index) => html`<${Cell} key=${entry.name} fill=${CFG.palette[index % CFG.palette.length]} />`)}
                  </Bar>
                </${BarChart}>
              </${ResponsiveContainer}>
            ` : html`<${EmptyState} title="Sin ranking todavía" detail="Aparecerá apenas tengamos compras del día para agrupar por comuna." />`}
          </${Panel}>

          <${Panel}
            title="Traffic split"
            subtitle="Mix de adquisición"
            kicker="Máximo cinco fuentes dominantes"
          >
            ${view.sources.length ? html`
              <div style=${{ display: "grid", gridTemplateColumns: "minmax(0,1fr)", gap: "12px", height: "100%" }}>
                <div style=${{ flex: 1, minHeight: 0 }}>
                  <${ResponsiveContainer} width="100%" height="100%">
                    <${PieChart}>
                      <Pie
                        data=${view.sources}
                        dataKey="value"
                        nameKey="name"
                        innerRadius=${55}
                        outerRadius=${86}
                        paddingAngle=${3}
                        stroke="rgba(0,0,0,0)"
                      >
                        ${view.sources.map((entry) => html`<${Cell} key=${entry.name} fill=${entry.fill} />`)}
                      </Pie>
                      <Tooltip content=${(props) => CustomTooltip({ ...props, formatter: (v) => `${INT.format(v)} ventas` })} />
                    </${PieChart}>
                  </${ResponsiveContainer}>
                </div>
                <div className="legend-row">
                  ${view.sources.map((entry) => html`
                    <div key=${entry.name} className="legend-pill" style=${{ borderColor: alpha(entry.fill, .35) }}>
                      <span style=${{ color: entry.fill, fontWeight: 700 }}>${entry.name}</span>
                      <span style=${{ color: "var(--muted)" }}> · ${INT.format(entry.value)}</span>
                    </div>
                  `)}
                </div>
              </div>
            ` : html`<${EmptyState} title="Sin fuentes visibles" detail="La dona se activará cuando entren ventas con origen de tráfico." />`}
          </${Panel}>

          <${Panel}
            title="Live feed"
            subtitle="Últimos movimientos detectados"
            kicker="Refresco amortiguado para no saturar la sala"
            className="feed-panel"
          >
            ${state.feed.length ? html`
              <div className="feed">
                ${state.feed.map((row) => html`
                  <div key=${row.id} className=${`feed-row ${state.flashIds.includes(row.id) ? "new" : ""}`}>
                    <div className="feed-time">${row.time}</div>
                    <div className="feed-main">
                      <div className="feed-city">${row.city}</div>
                      <div className="feed-item">${row.item} · ${row.source}</div>
                    </div>
                    <div className="feed-amount">${moneyCompact(row.amount)}</div>
                  </div>
                `)}
              </div>
            ` : html`<${EmptyState} title="Esperando primera venta" detail="El feed en vivo mostrará aquí las transacciones más recientes del día." />`}
          </${Panel}>
        </main>
      </div>

      ${state.count === 0 ? html`
        <div className="footer-banner">
          <div>
            <strong>La sala está limpia por ahora.</strong>
            <span>No hay ventas acumuladas hoy. El tablero permanece conectado y listo para encenderse apenas entre la próxima orden.</span>
          </div>
        </div>
      ` : null}

      ${!state.loaded ? html`
        <div className="overlay">
          <div className="overlay-card">
            <h2>Sincronizando el pulso del día</h2>
            <p>Cargando el historial actual y armando la primera lectura del tablero para sala.</p>
          </div>
        </div>
      ` : null}
    </div>
  `;
}

createRoot(document.getElementById("app")).render(html`<${App} />`);
</script>
</body>
</html>
